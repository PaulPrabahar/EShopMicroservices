services:
  catalogdb:
    image: postgres
    networks: [catalog]
  
  basketdb:
    image: postgres
    networks: [basket]


  catalog.api:
    image: ${DOCKER_REGISTRY-}catalogapi
    networks: [catalog]
    build:
      context: .
      dockerfile: Service/Catalog/Catalog.Api/Dockerfile

networks:
  catalog:
  basket:

volumes:
  postgres_catalog:
  postgres_basket:

